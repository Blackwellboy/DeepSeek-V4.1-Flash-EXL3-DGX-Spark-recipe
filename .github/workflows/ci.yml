name: Recipe CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: Python syntax
        run: |
          for f in scripts/*.py tests/*.py; do
            python -m py_compile "$f"
          done

      - name: JSON syntax
        run: |
          python -m json.tool configs/quantization_config.example.json >/dev/null
          python -m json.tool runtime.lock.json >/dev/null

      - name: Runtime and deployment contract tests
        run: python tests/test_recipe_contract.py
